name: Windows companion
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            companion/package-lock.json
      - run: npm ci
      - run: npm ci --prefix companion
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/audit-release.mjs --source-only
      - run: npm run companion:dist
      - run: node scripts/audit-release.mjs
      - name: Generate checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem companion/dist/*-Setup.exe
          $lines = foreach ($file in $files) { $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $lines | Set-Content companion/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Chappie-Windows-Companion
          path: |
            companion/dist/*-Setup.exe
            companion/dist/SHA256SUMS.txt
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./companion/package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF.Substring(10) }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --target $env:GITHUB_SHA --title "Chappie Companion $version (preview)" --prerelease --notes-file docs/RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY }
          gh release upload $tag companion/dist/*-Setup.exe companion/dist/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
